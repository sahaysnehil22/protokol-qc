services:
  - type: web
    name: protokol-qc-backend
    env: node
    region: ohio
    plan: starter
    rootDir: .
    buildCommand: cd backend && npm install && node src/seed.js
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
